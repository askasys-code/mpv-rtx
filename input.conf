# =========================================================================
# MPV Keybindings Configuration
# Dark Glass Notification HUD Integration (100% Pure Dark Glass)
# =========================================================================

# ===== Scalers, Neural Filters & Enhancements =====

# 1: NVIDIA RTX Video Super Resolution (Auto-Scaler)
1          no-osd set glsl-shaders "" ; script-message autovsr-toggle
Alt+1      script-message autovsr-update

# 2: NVIDIA Image Scaling (NIS - Toggle On/Off)
2          script-message custom-notify-scaler "NVIDIA NIS" "~~/scalers/NVScaler.glsl"

# 3: AMD FidelityFX Super Resolution (FSR 1.0 - Toggle On/Off)
3          script-message custom-notify-scaler "AMD FSR 1.0" "~~/scalers/FSR.glsl"

# 4: Qualcomm Snapdragon Game Super Resolution (SGSR - Toggle On/Off)
4          script-message custom-notify-scaler "Qualcomm SGSR" "~~/scalers/SGSR.glsl"

# 5: AMD Contrast Adaptive Sharpening (CAS - Toggle On/Off)
5          script-message custom-notify-scaler "AMD CAS" "~~/scalers/CAS-scaled.glsl"

# 6: AV1 Synthetic Film Grain Toggle & Info Overlay
6          script-message toggle-film-grain
Alt+6      script-message toggle-film-grain-hud
G          script-message toggle-film-grain
Alt+g      script-message toggle-film-grain-hud

# Reserved Number Keys
7          ignore
8          ignore

# NVIDIA RTX Video True HDR (SDR -> HDR auto-protection)
h          script-message autohdr-toggle

# ===== Master Reset, Scaling Fallback & Frame Pacing =====

# 9: Cycle base luma scaler fallback
9          no-osd cycle-values scale "nearest" "lanczos" ; script-message notify "BASE LUMA SCALER" "${scale}" "cyan" 2

# 0: Master Reset
0          no-osd set glsl-shaders "" ; no-osd vf remove @vsr ; no-osd vf remove @vsr_fmt ; no-osd vf remove @truehdr ; no-osd vf remove @truehdr_fmt ; no-osd vf remove @filmgrain ; no-osd set af "" ; no-osd set scale "lanczos" ; no-osd set video-sync "display-resample" ; no-osd set interpolation "yes" ; no-osd set video-zoom 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; no-osd set panscan 0 ; script-message notify "MASTER RESET" "Default Scaling, Pacing & Geometry Restored" "yellow" 2.5

# M (Shift+M): Toggle Frame Pacing
M          no-osd cycle-values video-sync "display-resample" "audio" ; no-osd cycle-values interpolation "yes" "no" ; script-message notify "FRAME PACING" "Sync: ${video-sync} | Interpolation: ${interpolation}" "cyan" 2.2

# ===== Telemetry, Overlays & Diagnostics =====

# TAB: Synchronized Master Toggle (Opens / Closes Both HUDs Together)
TAB        script-message toggle-both-monitors

# Individual HUD Toggles
i          script-message toggle-media-monitor
I          script-message toggle-media-monitor
g          script-message toggle-gpu-monitor

# ===== Image Viewer & Video Geometry Controls =====

# Smooth Zooming (Handles regular scroll and Ctrl+scroll - Zero White Text!)
WHEEL_UP        script-message custom-notify-zoom  0.10
WHEEL_DOWN      script-message custom-notify-zoom -0.10
Ctrl+WHEEL_UP   script-message custom-notify-zoom  0.10
Ctrl+WHEEL_DOWN script-message custom-notify-zoom -0.10

# Keyboard Zooming
Ctrl++          script-message custom-notify-zoom  0.10
Ctrl+=          script-message custom-notify-zoom  0.10
Ctrl+-          script-message custom-notify-zoom -0.10

# Reset Zoom & Center Pan (Middle Click, Backspace, or Ctrl+BS)
MBTN_MID        script-message custom-notify-reset-geo
BS              script-message custom-notify-reset-geo
Ctrl+BS         script-message custom-notify-reset-geo

# Viewport Panning (Move around images / zoomed videos)
Alt+LEFT        no-osd add video-pan-x  0.05
Alt+RIGHT       no-osd add video-pan-x -0.05
Alt+UP          no-osd add video-pan-y  0.05
Alt+DOWN        no-osd add video-pan-y -0.05

# Orientation & Rotation
r               no-osd cycle-values video-rotate 90 180 270 0 ; script-message notify "ROTATION" "${video-rotate}°" "cyan" 1.8
R               no-osd cycle-values video-rotate 270 180 90 0 ; script-message notify "ROTATION" "${video-rotate}°" "cyan" 1.8
Alt+v           no-osd cycle-values video-hflip yes no ; script-message notify "HORIZONTAL MIRROR" "${video-hflip}" "cyan" 1.8

# ===== Playback, Navigation & Playlist =====

SPACE           no-osd cycle pause
MBTN_RIGHT      no-osd cycle pause
q               quit
ESC             quit

# Prevent Windows Explorer Enter keydown leak from skipping images
ENTER           ignore
KP_ENTER        ignore

# Precise Seeking (Video)
LEFT            no-osd seek -5 exact
RIGHT           no-osd seek  5 exact
Shift+LEFT      no-osd seek -1 exact
Shift+RIGHT     no-osd seek 1 exact
.               no-osd frame-step ; script-message notify "FRAME STEP" "Forward" "cyan" 1.2
,               no-osd frame-back-step ; script-message notify "FRAME STEP" "Backward" "cyan" 1.2

# Playlist & Image Browsing
PGUP            playlist-prev
PGDWN           playlist-next
CTRL+LEFT       playlist-prev
CTRL+RIGHT      playlist-next

# Playback Loops & Deband
l               no-osd cycle-values loop-file inf no ; script-message notify "LOOP MODE" "${loop-file}" "cyan" 1.8
d               no-osd cycle deband ; script-message notify "DEBAND FILTER" "${deband}" "cyan" 1.8

# ===== Audio, Volume & Track Controls =====

UP              script-message custom-notify-volume  2
DOWN            script-message custom-notify-volume -2
m               no-osd cycle mute ; script-message notify "AUDIO MUTE" "${?mute==yes:MUTED}${!mute==yes:UNMUTED}" "${?mute==yes:red}${!mute==yes:green}" 1.8

# Subtitle Visibility & Track Switching
v               no-osd cycle sub-visibility ; script-message notify "SUBTITLES" "${sub-visibility}" "cyan" 1.8
j               no-osd cycle sub ; script-message notify "SUBTITLE TRACK" "${sub}" "cyan" 1.8
J               no-osd cycle sub down ; script-message notify "SUBTITLE TRACK" "${sub}" "cyan" 1.8
k               no-osd cycle audio ; script-message notify "AUDIO TRACK" "${audio}" "cyan" 1.8
K               no-osd cycle audio down ; script-message notify "AUDIO TRACK" "${audio}" "cyan" 1.8

# ===== Window, Tools & Screenshots =====

f               no-osd cycle fullscreen
F11             no-osd cycle fullscreen
W               script-binding display-clip-maker
s               no-osd screenshot ; script-message notify "SCREENSHOT" "Captured to Desktop" "green" 2
S               no-osd screenshot video ; script-message notify "CLEAN SCREENSHOT" "Captured (No Subtitles)" "green" 2

# ===== Audio DSP, Headphone Bass Boost & Channel Solo =====

a               script-message toggle-audio-hud
A               script-message cycle-audio-dsp
b               script-message cycle-bass-boost
B               script-message cycle-channel-solo

# Direct Channel Solo Toggles
Ctrl+1          script-message set-channel-solo front
Ctrl+2          script-message set-channel-solo center
Ctrl+3          script-message set-channel-solo surround
Ctrl+4          script-message set-channel-solo rear
Ctrl+5          script-message set-channel-solo lfe
Ctrl+0          script-message set-channel-solo all