# =========================================================================
# MPV Media Type Profiles (Video, Audio, Image)
# =========================================================================

# ===== Moving Video (Files, Streams & Web) =====

[VIDEO]
profile-cond=p["current-tracks/video"] ~= nil and not p["current-tracks/video/image"]
profile-restore=copy

# ===== Standalone Audio & Music (with or without Album Art) =====

[AUDIO]
profile-cond=p["current-tracks/video"] == nil or p["current-tracks/video/albumart"] == true
profile-restore=copy
background-color='#000000'

# ===== Still Images (Photos, Graphics & Transparent PNGs) =====

[IMAGE]
profile-cond=p["current-tracks/video/image"] == true and not p["current-tracks/video/albumart"]
profile-restore=copy                          # Ensure previous video/audio settings are restored on track change
keep-open=always                              # Strictly prevent auto-advancing to next playlist item on image EOF
image-display-duration=inf                    # Keep still images displayed indefinitely
loop-file=inf                                 # Hold single image frame indefinitely

vf=                                           # Disable video filters (VSR / HDR) for still photos by default
glsl-shaders=""                               # Clear active video upscaler shaders on open for clean reproduction

# Real-Time Pan & Zoom Performance Optimizations (prevents compute lockup on massive photos)
dither=fruit                                  # Ordered dithering
correct-downscaling=no                        # Bypass costly sample weight adjustments during real-time zoom sweeps
sigmoid-upscaling=no                          # Bypass sigmoidal curve conversions for instant viewport responsiveness
linear-downscaling=no                         # Avoid linear gamma roundtrips during zoom operations

# Fast, lightweight base scalers for instantaneous image loading
scale=spline36                                # Clean, ringing-free, fast bicubic/spline scaler (no Lanczos strain)
dscale=mitchell                               # High-quality downscaler for high-res camera photos

icc-profile-auto=yes                          # Enable display color management for tagged photos
osc=no
osd-bar=no
demuxer-max-bytes=100M
border=yes
background=color                              # Disable checkerboard tiles and use solid background color
background-color='#000000'                  # Pure black background (turns off OLED pixels)
background-tile-color-0='#000000'           # Fallback black for primary tiles
background-tile-color-1='#000000'           # Fallback black for secondary tiles